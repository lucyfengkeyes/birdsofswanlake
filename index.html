<!DOCTYPE html>
<html>
    <title> Birds of Swan Lake Park</title>
    <body>
        <img src="birdcollage.png" alt="Bird Collage" width="2048" height="1680">

        <canvas id="myCanvas" width="2048" height="1680" style="position:absolute; left:0px; top:0px;"></canvas>
 <script>

        const swan = new Audio("trumpeterswan.mp3");
        const goose = new Audio("canadagoose.mp3");
        const cardinal = new Audio("northerncardinal.mp3");
        const gull = new Audio("gull.mp3");
        const dove = new Audio("mourningdove.mp3");
        const warbler = new Audio("warbler.mp3");
        const woodpecker = new Audio("woodpecker.mp3");
        
        swan.loop = true;
        goose.loop = true;
        cardinal.loop = true;
        gull.loop = true;
        dove.loop = true;
        warbler.loop = true;
        woodpecker.loop = true;

        const birds = [
        {
            name: "swan",
            left: 900,
            right: 1000,
            top: 750,
            bottom: 800,
            sound: swan
        },
        {
            name: "goose",
            left: 800,
            right: 1600,
            top: 400,
            bottom: 800,
            sound: goose
        },
        {
            name: "cardinal",
            left: 1700,
            right: 2000,
            top: 100,
            bottom: 300,
            sound: cardinal
        },
        {
            name: "gull",
            left: 100,
            right: 400,
            top: 100,
            bottom: 900,
            sound: gull
        },
        {
            name: "dove",
            left: 100,
            right: 400,
            top: 100,
            bottom: 1300,
            sound: dove
        },
        {
            name: "woodpecker",
            left: 1300,
            right: 1800,
            top: 300,
            bottom: 800,
            sound: woodpecker
        },
        {
            name: "warbler",
            left: 300,
            right: 800,
            top: 300,
            bottom: 500,
            sound: warbler
        }


        
        ];

        function updateBirdSounds() {

            const left = window.scrollX;
            const top = window.scrollY;

            const right = left + window.innerWidth;
            const bottom = top + window.innerHeight;

            birds.forEach(bird => {

                const visible =
                    bird.right >= left &&
                    bird.left <= right &&
                    bird.bottom >= top &&
                    bird.top <= bottom;
                if (visible) {

                    if (bird.sound.paused) {
                        console.log("PLAYING", bird.name);
                        bird.sound.play();
                    }

                } else {

                    bird.sound.pause();
                    bird.sound.currentTime = 0;

                }

            });

        }

        window.addEventListener("scroll", updateBirdSounds);
        document.addEventListener("click", function() {

            swan.play();
            swan.pause();

            goose.play();
            goose.pause();

            cardinal.play();
            cardinal.pause();

            dove.play();
            dove.pause();   

            gull.play();
            gull.pause();

            woodpecker.play();
            woodpecker.pause();

            warbler.play();
            warbler.pause();

        });
        updateBirdSounds();

        </script>

       
    </body>

</html>
